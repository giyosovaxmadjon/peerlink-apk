name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  APP_URL: "https://peerlinksafe.yusupovanigoraxon1990.workers.dev"
  APP_NAME: "PeerLink Safe"
  APP_ID: "uz.peerlink.safe"
  BG_COLOR: "#080D18"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Ikonkalarni olish
        run: |
          # Repoda icons/ papkasi bo'lsa shuni oladi, bo'lmasa saytingizdan yuklaydi
          mkdir -p icons
          for f in icon-512 icon-maskable-512; do
            if [ -f "icons/$f.png" ]; then
              echo "Repodan: $f.png"
            else
              echo "Saytdan: $APP_URL/$f.png"
              curl -fsSL "$APP_URL/$f.png" -o "icons/$f.png"
            fi
          done

      - name: Capacitor loyihasini yaratish
        run: |
          mkdir -p app && cd app
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          echo '<!doctype html><meta charset="utf-8"><title>PeerLink Safe</title>' > www/index.html
          cat > capacitor.config.json <<JSON
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "server": { "url": "$APP_URL", "androidScheme": "https" },
            "android": { "backgroundColor": "$BG_COLOR" }
          }
          JSON
          npx cap add android

      - name: Ikonka va splash qo'yish
        run: |
          RES=app/android/app/src/main/res
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            mkdir -p "$RES/mipmap-$1"
            convert icons/icon-512.png -resize "${2}x${2}" "$RES/mipmap-$1/ic_launcher.png"
            cp "$RES/mipmap-$1/ic_launcher.png" "$RES/mipmap-$1/ic_launcher_round.png"
            convert icons/icon-maskable-512.png -resize "${3}x${3}" "$RES/mipmap-$1/ic_launcher_foreground.png"
          done
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/values"
          for n in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$n.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done
          cat > "$RES/values/ic_launcher_background.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">$BG_COLOR</color>
          </resources>
          XML
          # oq splash o'rniga to'q fon
          find "$RES" -name 'splash*.png' -exec convert {} -fill "$BG_COLOR" -colorize 100 {} \;

      - name: APK yig'ish
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK ni nomlash
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk PeerLink-Safe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PeerLink-Safe-APK
          path: PeerLink-Safe.apk
